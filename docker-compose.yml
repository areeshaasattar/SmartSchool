services:
  mongodb:
    image: mongo:7
    container_name: smartschool-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: smartschool-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  worker:
    image: node:22-alpine
    working_dir: /app/server
    command: sh -c "npm install && npm run worker"
    volumes:
      - .:/app
    environment:
      REDIS_URL: redis://redis:6379
      MONGO_URI: mongodb://root:rootpassword@mongodb:27017/smartschool?authSource=admin
    depends_on:
      - mongodb
      - redis

volumes:
  mongodb_data:
  redis_data:
