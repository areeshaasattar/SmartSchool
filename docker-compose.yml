services:
  mongodb:
    image: mongo:7
    container_name: smartschool-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: smartschool-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: smartschool-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  ai-service:
    image: python:3.12-slim
    working_dir: /app/ai-service
    command: sh -c "pip install --no-cache-dir -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      AI_SERVICE_KEY: ${AI_SERVICE_KEY:-change-me}
      QDRANT_URL: http://qdrant:6333
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      - qdrant

  worker:
    image: node:22-alpine
    working_dir: /app/server
    command: sh -c "npm install && npm run worker"
    volumes:
      - .:/app
    environment:
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_KEY: ${AI_SERVICE_KEY:-change-me}
      MONGO_URI: mongodb://root:rootpassword@mongodb:27017/smartschool?authSource=admin
    depends_on:
      - mongodb
      - redis
      - qdrant
      - ai-service

volumes:
  mongodb_data:
  redis_data:
  qdrant_data:
